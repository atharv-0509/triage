[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metapilot"
version = "0.1.0"
description = "Meta-learned and LLM-based pipeline selection for tabular machine learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.6",
    "lightgbm>=4.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
openml = ["openml>=0.14"]
flaml = ["flaml[automl]>=2.1"]
# Phase 2 fine-tuning/generation; tested with torch 2.15, transformers 5.23, peft 0.21, trl 1.18.
# Add bitsandbytes on a CUDA machine for 4-bit loading.
llm = ["torch>=2.4", "transformers>=5.0,<6", "peft>=0.17", "trl>=1.0,<2", "datasets>=3.0", "accelerate>=1.0"]
demo = ["gradio>=5"]
dev = ["pytest>=7"]

[project.scripts]
metapilot = "metapilot.cli:main"

[tool.setuptools.packages.find]
include = ["metapilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
