[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metapilot"
version = "0.1.0"
description = "Meta-learned and LLM-based pipeline selection for tabular machine learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.6",
    "lightgbm>=4.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
openml = ["openml>=0.14"]
dev = ["pytest>=7"]

[project.scripts]
metapilot = "metapilot.cli:main"

[tool.setuptools.packages.find]
include = ["metapilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
