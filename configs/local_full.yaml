# Full-study settings (full portfolio, 10 subsamples, 2,000-row cap) on the
# sources that need no download. A stand-in until OpenML data is available;
# most parents are synthetic, so treat results as a scale test, not findings.
name: local_full
seed: 0
sources: [sklearn, synthetic, moons_circles]
n_synthetic: 40
n_moons_circles: 10
max_rows: 2000
subsamples_per_parent: 10
portfolio: full
cv_folds: 3
fit_timeout: 120
n_jobs: -1
outer_folds: 5
